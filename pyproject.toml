[tool.pytest.ini_options]
pythonpath = ["src/"]
testpaths = "tests"
filterwarnings = ["error::DeprecationWarning"]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "S", "C90", "B", "UP", "ANN", "N"]
ignore = [
    "N815", # 2030.5 has some mixed casing so we're forced to inherit
    "N802", # 2030.5 has some mixed casing so we're forced to inherit
    "UP035", # Need to support python 3.9 so we need the old typing.Optional
    "UP006", # Need to support python 3.9 so we need the old typing.List
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN", "N"]

[tool.ty.src]
include = ["src", "tests"]

[tool.bandit]
exclude_dirs = ["tests"]

[build-system]
requires = ["setuptools >= 40.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "envoy_schema"
version = "2.1.1"
description = "Envoy Schema - a collection of pydantic models compatible with the Envoy utility server"
authors = [{ name = "Battery Storage and Grid Integration Program" }]
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["envoy", "csip-aus", "2030.5", "csip", "pydantic"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",

    # Pick your license as you wish (see also "license" above)
    "Framework :: Pydantic",
    "License :: OSI Approved :: MIT License",

    # Specify the Python versions you support here.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.5.0,!=2.6.0, !=2.12.0",
    "pydantic_xml[lxml]>=2.12.0",
]

[project.urls]
Homepage = "https://github.com/bsgip/envoy-schema"


[project.optional-dependencies]
all = ["envoy_schema[dev, test]"]
dev = ["bandit", "ruff", "ty", "types-python-dateutil", "types-tzlocal", "types-lxml"]
test = ["pytest", "assertical"]
build = ["twine"]

[tool.setuptools.package-data]
"envoy_schema" = ["py.typed"]
